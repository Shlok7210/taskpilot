<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskPilot</title>
<style>
:root{--bg:#0f1419;--card:#1a212b;--tx:#e8edf3;--mut:#8b98a8;--ac:#4fd1a5;--warn:#f5a524;--bad:#f06565}
@media(prefers-color-scheme:light){:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#5d6b7a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:980px;margin:0 auto;padding:24px;display:grid;gap:16px;grid-template-columns:1.2fr 1fr}
@media(max-width:800px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:26px}h1 span{color:var(--ac)}.sub{grid-column:1/-1;color:var(--mut);margin:-8px 0 0}
.card{background:var(--card);border-radius:12px;padding:16px}h2{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #3a4656;background:transparent;color:var(--tx);font-size:15px}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;font-weight:600;background:var(--ac);color:#06281e}button.alt{background:transparent;color:var(--tx);border:1px solid #3a4656}button.bad{background:var(--bad);color:#fff}
.step{border-left:3px solid #3a4656;padding:6px 10px;margin:8px 0}.step.done{border-color:var(--ac)}.step.awaiting_approval{border-color:var(--warn)}.step.rejected,.step.skipped{border-color:var(--bad);opacity:.7}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:#3a4656;color:#fff}.tag.risk{background:var(--warn);color:#2b1c00}
pre{white-space:pre-wrap;background:#0003;padding:8px;border-radius:6px;font-size:12px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.log{font-size:13px;border-bottom:1px solid #3a465655;padding:6px 0}.mut{color:var(--mut)}
</style></head><body><main>
<h1>Task<span>Pilot</span></h1><p class="sub">Plans and runs your everyday app tasks, pausing before anything risky. <span id="mode"></span></p>
<section class="card"><h2>Task</h2>
<div class="row" style="margin:0 0 8px"><input id="t" placeholder='e.g. "Reschedule my dentist appointment to 2026-10-12 11:00 and email the clinic"'><button onclick="go()">Run</button></div>
<div class="row" style="margin:0 0 8px;flex-wrap:wrap">
<button class="alt" onclick="ex(0)">Reschedule + email</button><button class="alt" onclick="ex(1)">Delete standup</button><button class="alt" onclick="ex(2)">Add a note</button></div>
<div id="run"></div></section>
<section class="card"><h2>Action log &amp; undo</h2><div id="log" class="mut">Nothing yet.</div>
<div class="row"><button class="alt" onclick="rst()">Reset sandbox</button></div></section>
<section class="card" style="grid-column:1/-1"><h2>Connected sandbox (Calendar · Inbox · Notes)</h2><pre id="ws"></pre></section>
</main><script>
const EX=["Reschedule my dentist appointment to 2026-10-12 11:00 and email the clinic","Delete my team standup","Add a note: buy a charger before the demo"];
const $=id=>document.getElementById(id);let run=null;
const api=(p,b)=>fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{}).then(r=>r.json());
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function ex(i){$("t").value=EX[i];go()}
async function go(){const t=$("t").value.trim();if(!t)return;run=await api("/api/task",{text:t});draw();refresh()}
async function dec(a){run=await api(`/api/run/${run.id}/decision`,{approve:a});draw();refresh()}
async function und(id){await api("/api/undo/"+id,{});refresh()}
async function rst(){await api("/api/reset",{});run=null;draw();refresh()}
function draw(){if(!run){$("run").innerHTML="";return}
$("mode").textContent="Planner: "+run.planner;
$("run").innerHTML=run.steps.map(s=>`<div class="step ${s.status}"><b>${esc(s.tool)}</b> ${s.risk?`<span class="tag risk">needs approval: ${esc(s.risk)}</span>`:""} <span class="tag">${s.status.replace("_"," ")}</span>
<div class="mut">${esc(s.why)}</div>${s.result?`<div>${esc(s.result)}</div>`:""}
${s.status=="awaiting_approval"?`<pre>BEFORE: ${esc(JSON.stringify(s.preview.before,null,1))}\nAFTER:  ${esc(JSON.stringify(s.preview.after,null,1))}</pre><div class="row"><button onclick="dec(true)">Approve</button><button class="bad" onclick="dec(false)">Reject</button></div>`:""}</div>`).join("")}
async function refresh(){const s=await api("/api/state");$("ws").textContent=JSON.stringify(s.workspace,null,1);
$("log").innerHTML=s.log.length?s.log.map(e=>`<div class="log">${e.ts} · ${esc(e.result)} ${e.approved?'<span class="tag risk">approved</span>':""}
${e.undone?'<span class="tag">undone</span>':e.undoable?`<button class="alt" onclick="und('${e.id}')">Undo</button>`:'<span class="mut">(not reversible)</span>'}</div>`).join(""):"Nothing yet."}
refresh();
</script></body></html>
